<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kartkoll</title>
<meta name="description" content="Kartkoll – träna inför geografiprovet: quiz, begreppskort och dagens uppdrag.">
<meta name="theme-color" content="#2f7fc1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kartkoll">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one thing per screen. Home = today's mission + four map-legend topic tiles. Every other screen has one big back button and one big next step. */
:root{
  --paper:#f3f7f4; --card:#ffffff; --ink:#1d2b2a; --muted:#566865; --line:#cfdcd7;
  --water:#2f7fc1; --forest:#2f8a57; --field:#9a7000; --town:#d2452f;
  --water-bg:#e3f0fa; --forest-bg:#e2f3e8; --field-bg:#fbf1d2; --town-bg:#fbe5e1;
  --good:#2f8a57; --good-bg:#e2f3e8; --bad:#c23a2a; --bad-bg:#fbe5e1; --warn:#a36f00; --warn-bg:#fbf1d2;
  --star:#f2b705; --accent:#2f7fc1; --onaccent:#ffffff;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#101816; --card:#18231f; --ink:#e6efec; --muted:#9cb0aa; --line:#2c3c37;
  --water:#6aaee6; --forest:#5cc287; --field:#e8bf45; --town:#f07a64;
  --water-bg:#15293a; --forest-bg:#16301f; --field-bg:#352c10; --town-bg:#3a1c17;
  --good:#5cc287; --good-bg:#16301f; --bad:#f07a64; --bad-bg:#3a1c17; --warn:#e8bf45; --warn-bg:#352c10;
  --star:#f5c842; --accent:#6aaee6; --onaccent:#0e1a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#101816; --card:#18231f; --ink:#e6efec; --muted:#9cb0aa; --line:#2c3c37;
  --water:#6aaee6; --forest:#5cc287; --field:#e8bf45; --town:#f07a64;
  --water-bg:#15293a; --forest-bg:#16301f; --field-bg:#352c10; --town-bg:#3a1c17;
  --good:#5cc287; --good-bg:#16301f; --bad:#f07a64; --bad-bg:#3a1c17; --warn:#e8bf45; --warn-bg:#352c10;
  --star:#f5c842; --accent:#6aaee6; --onaccent:#0e1a26; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5}
button{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--warn);outline-offset:3px}
#app{max-width:680px;margin:0 auto;padding-block:16px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.small{font-size:15px;color:var(--muted)}
.eyebrow{font-size:14px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:60px;padding:12px 20px;border-radius:16px;border:0;background:var(--accent);color:var(--onaccent);font:800 21px var(--display);cursor:pointer;box-shadow:0 4px 0 color-mix(in srgb,var(--accent) 60%,#000);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.green{background:var(--good);color:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--good) 60%,#000)}
.btn.orange{background:var(--warn);color:var(--card);box-shadow:0 4px 0 color-mix(in srgb,var(--warn) 60%,#000)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:44px;padding:8px 14px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:700 16px var(--body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.stack-btns{display:flex;flex-direction:column;gap:12px}

/* top bar on inner screens */
.topbar{display:flex;align-items:center;gap:12px}
.back{display:inline-flex;align-items:center;gap:6px;min-height:48px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);font:800 18px var(--display);cursor:pointer;flex:none}
.back.sure{border-color:var(--bad);color:var(--bad)}
.prog{flex:1;min-width:0;display:flex;align-items:center;gap:10px;font:800 18px var(--display);font-variant-numeric:tabular-nums}
.bar{flex:1;height:14px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .35s}

/* home */
.hello{display:flex;align-items:center;justify-content:space-between;gap:12px}
.hello h1{font-size:clamp(38px,9vw,52px);font-weight:800}
.mission{border-radius:22px;padding:20px;background:var(--cb);border:3px solid var(--c);display:flex;flex-direction:column;gap:10px}
.mission .eyebrow{color:var(--c)}
.mission h2{font-size:30px;font-weight:800}
.mission .done{display:flex;align-items:center;gap:10px;font:800 20px var(--display);color:var(--good)}
.mission .done svg{width:30px;height:30px}
.score{display:flex;flex-direction:column;gap:8px}
.score .line{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-family:var(--display);font-weight:800;font-size:20px}
.score .line b{font-size:26px;font-variant-numeric:tabular-nums}
.score .bar{height:18px}
.score .bar i{background:var(--good)}
.sec{font-size:24px;font-weight:800}
.topics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.topic{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:left;padding:16px;border-radius:20px;border:2px solid transparent;background:var(--tb);cursor:pointer;min-width:0;transition:transform .1s}
.topic:hover{border-color:var(--tc)}
.topic:active{transform:scale(.98)}
.topic .ic{width:44px;height:44px;border-radius:12px;background:var(--tc);color:var(--card);display:grid;place-items:center}
.topic .ic svg{width:28px;height:28px}
.topic b{font:800 20px/1.15 var(--display);color:var(--ink)}
.topic .small{color:var(--ink);opacity:.8}
.topic .bar{width:100%;height:10px;background:color-mix(in srgb,var(--tc) 22%,var(--card))}
.topic .bar i{background:var(--tc)}
.extra{display:grid;gap:10px}
.row-btn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;min-height:68px;border-radius:18px;border:2px solid var(--line);background:var(--card);cursor:pointer}
.row-btn:hover{border-color:var(--accent)}
.row-btn .ic{flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--water-bg);color:var(--water)}
.row-btn .ic svg{width:24px;height:24px}
.row-btn.hard .ic{background:var(--warn-bg);color:var(--warn)}
.row-btn b{display:block;font:800 19px/1.2 var(--display)}
.row-btn span.small{display:block}
.row-btn .go{margin-left:auto;font:800 24px var(--display);color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;border-top:2px dashed var(--line);padding-top:16px}

/* topic screen */
.topic-hero{border-radius:22px;padding:22px;background:var(--tb);display:flex;flex-direction:column;gap:12px}
.topic-hero .ic{width:56px;height:56px;border-radius:16px;background:var(--tc);color:var(--card);display:grid;place-items:center}
.topic-hero .ic svg{width:34px;height:34px}
.topic-hero h1{font-size:34px;font-weight:800}
.topic-hero .bar{height:14px;background:color-mix(in srgb,var(--tc) 22%,var(--card))}
.topic-hero .bar i{background:var(--tc)}

/* quiz */
.qcard{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:16px}
.qmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.tag{font-weight:700;padding:3px 10px;border-radius:8px;font-size:14px;display:inline-block}
.streak{font:800 16px var(--display);color:var(--town)}
.q{font-family:var(--display);font-size:clamp(24px,5.4vw,30px);font-weight:700;line-height:1.25;text-wrap:balance}
.en{color:var(--muted);font-size:16px;font-style:italic}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;min-height:64px;padding:12px 14px;border-radius:16px;border:3px solid var(--line);background:var(--paper);font:18px/1.3 var(--body);cursor:pointer;transition:transform .08s,border-color .15s}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{cursor:default}
.opt .k{flex:none;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--card);border:2px solid var(--line);font:800 18px var(--display)}
.opt .t{flex:1;min-width:0}
.opt .m{flex:none;font:800 26px var(--display);width:28px;text-align:center}
.opt.ok{border-color:var(--good);background:var(--good-bg)}
.opt.ok .k{background:var(--good);border-color:var(--good);color:var(--card)}
.opt.ok .m{color:var(--good)}
.opt.no{border-color:var(--bad);background:var(--bad-bg)}
.opt.no .k{background:var(--bad);border-color:var(--bad);color:var(--card)}
.opt.no .m{color:var(--bad)}
.opt.dim{opacity:.5}
.fb{border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;animation:pop .25s ease-out}
.fb.good{background:var(--good-bg);border:2px solid var(--good)}
.fb.bad{background:var(--bad-bg);border:2px solid var(--bad)}
.fb .h{font:800 24px var(--display)}
.fb.good .h{color:var(--good)}
.fb.bad .h{color:var(--bad)}
@keyframes pop{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.keys{text-align:center}

/* results */
.result{position:relative;overflow:hidden;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}
.stars{display:flex;gap:6px}
.stars svg{width:58px;height:58px;fill:var(--line)}
.stars svg.on{fill:var(--star);animation:star .4s ease-out backwards}
.stars svg.on:nth-child(2){animation-delay:.15s}.stars svg.on:nth-child(3){animation-delay:.3s}
@keyframes star{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
.result .big{font:800 46px/1 var(--display);font-variant-numeric:tabular-nums}
.result .msg{font:700 21px/1.3 var(--display);max-width:30ch;text-wrap:balance}
.result .stack-btns{width:100%;margin-top:6px}
.confetti i{position:absolute;top:-12px;width:10px;height:14px;border-radius:2px;animation:fall 1.8s ease-in forwards;opacity:.9}
@keyframes fall{to{transform:translateY(520px) rotate(540deg);opacity:0}}
.remember{display:flex;flex-direction:column;gap:10px}
.remember ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.remember li{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.remember li .a{border-left:5px solid var(--good);padding-left:10px;font-weight:700}

/* flashcards */
.flipwrap{perspective:1200px}
.flip{position:relative;display:block;width:100%;min-height:280px;border:0;padding:0;background:none;cursor:pointer;transform-style:preserve-3d;transition:transform .5s}
.flip.on{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:22px;padding:24px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:12px;text-align:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{background:var(--card);border:3px solid var(--line)}
.back-face{background:var(--tb);border:3px solid var(--tc);transform:rotateY(180deg)}
.term{font:800 clamp(34px,8vw,46px)/1.05 var(--display);overflow-wrap:anywhere}
.def{font-size:22px;line-height:1.4;max-width:30ch}
.hint{color:var(--muted);font-size:16px;max-width:28ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.prev{align-self:center;background:none;border:0;color:var(--muted);font:700 16px var(--body);text-decoration:underline;cursor:pointer;min-height:44px}

/* adults */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.panel h2{font-size:22px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--paper);display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font:800 36px/1 var(--display)}
.tile span{font-size:14px;color:var(--muted)}
.stackbar{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}
.stackbar i{display:block;height:100%}
.s-mastered{background:var(--good)}.s-learning{background:var(--water)}.s-weak{background:var(--bad)}.s-new{background:var(--line)}
.legendkey{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted)}
.legendkey span{display:inline-flex;align-items:center;gap:6px}
.legendkey i{width:12px;height:12px;border-radius:3px;display:inline-block}
.arow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.arow:first-child{border-top:0}
.arow .stackbar{grid-column:1/-1}
.arow b{font-family:var(--display);font-size:18px}
.list{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.list li{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;background:var(--paper);min-width:0}
.list li .a{border-left:4px solid var(--forest);padding-left:10px}
.plan li{flex-direction:row;align-items:flex-start;gap:12px}
.plan li.past{opacity:.55}
.plan li.now{border-color:var(--accent);border-width:2px}
.plan input{width:22px;height:22px;margin-top:3px;flex:none;accent-color:var(--forest)}
.plan .d{font-family:var(--display);font-weight:700;min-width:84px}
.trend{display:flex;align-items:flex-end;gap:8px;height:140px;border-bottom:2px solid var(--line)}
.trend .col{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:3px}
.trend .col i{display:block;width:100%;max-width:46px;background:var(--accent);border-radius:6px 6px 0 0}
.trend .col b{font-size:12px}
.xl{display:flex;gap:8px}
.xl span{flex:1;min-width:0;text-align:center;font-size:12px;color:var(--muted)}
.empty{border:2px dashed var(--line);border-radius:12px;padding:16px;color:var(--muted)}
.warntxt{color:var(--warn);font-weight:700}
@media (max-width:380px){.topics{grid-template-columns:1fr}.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.confetti{display:none}}
</style>
</head>
<body>

<main id="app" aria-live="polite"></main>

<script>
const ICON={
  delar:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"><path d="M3 6.5l6-2.5 6 2.5 6-2.5v13.5l-6 2.5-6-2.5-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>',
  kartan:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>',
  natur:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 20l7-12 4 6 3-4 6 10z"/><path d="M7.3 11l1.7 1.5 1.5-1.5"/></svg>',
  klimat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.2"/><path d="M9 2v1.4M2.5 8.5h1.4M4.4 3.9l1 1M13.6 3.9l-1 1"/><path d="M8.5 20h9a3.5 3.5 0 0 0 .3-7 5 5 0 0 0-9.6 1.6A2.8 2.8 0 0 0 8.5 20z"/></svg>',
  mix:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h3.5c4 0 6 10 10 10H21M3 17h3.5c1.6 0 2.8-1.6 3.9-3.5M13.6 9.5C14.7 8 15.6 7 17 7H21M18 4l3 3-3 3M18 14l3 3-3 3"/></svg>',
  hard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="7" y="3" width="13" height="16" rx="2.5"/><path d="M4 7v11a3 3 0 0 0 3 3h9"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="2"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4 6.1 20.5l1.2-6.5L2.5 9.4l6.6-.9z"/></svg>'
};
const AREAS={
  delar:{name:"Sveriges delar",pages:"s. 6–11",col:"--water",bg:"--water-bg"},
  kartan:{name:"Kartan",pages:"s. 12–17",col:"--town",bg:"--town-bg"},
  natur:{name:"Naturlandskapet",pages:"s. 18–21",col:"--forest",bg:"--forest-bg"},
  klimat:{name:"Årstider, väder & klimat",pages:"s. 22–27",col:"--field",bg:"--field-bg"}
};
// [area, question, correct answer, [3 wrong answers], English gloss, textbook page]
const Q=[
// ---- Sveriges delar
["delar","Hur många landskap har Sverige?","25",["15","21","30"],"How many provinces (landskap) does Sweden have?","s. 6"],
["delar","Vad heter Sveriges tre landsdelar?","Götaland, Svealand och Norrland",["Skåne, Småland och Gotland","Norrland, Lappland och Jämtland","Svealand, Dalarna och Värmland"],"What are Sweden's three regions (landsdelar)?","s. 6"],
["delar","Vilket av dessa är ett landskap?","Dalarna",["Svealand","Götaland","Norrland"],"Which of these is a province (landskap)?","s. 6"],
["delar","Vilket av dessa är en landsdel?","Norrland",["Lappland","Dalarna","Skåne"],"Which of these is one of the three big regions?","s. 6"],
["delar","Vilken landsdel ligger längst i söder?","Götaland",["Svealand","Norrland","Lappland"],"Which region lies furthest south?","s. 6"],
["delar","Vilket landskap ligger längst i söder i Sverige?","Skåne",["Blekinge","Halland","Gotland"],"Which province lies furthest south?","s. 6"],
["delar","Vad är en dialekt?","Olika sätt att tala samma språk",["Ett eget språk som bara finns i Norrland","Ett annat ord för landskap","Ett sätt att skriva på en karta"],"What is a dialect?","s. 6"],
["delar","Var finns gränserna mellan landskapen?","Bara ritade på kartor",["Som låga stängsel i naturen","Som breda vägar mellan landskapen","Som tydliga linjer i skogen"],"Where are the borders between provinces?","s. 6"],
["delar","Ungefär hur många människor bor i Sverige?","Tio miljoner",["En miljon","Hundra miljoner","En halv miljon"],"About how many people live in Sweden?","s. 8"],

// ---------- helpers
// Progress (stats, hist, marks, plan) is kept in the artifact's web database (doc progress/lev),
// shared by everyone who can save on this page, with a copy in this browser as fallback.
// "en" stays a per-device setting.
const SYNC=["stats","hist","marks","plan"];
const local={get(k,d){try{const v=localStorage.getItem("geo:"+k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem("geo:"+k,JSON.stringify(v))}catch(e){}}};
const mem={};SYNC.forEach(k=>mem[k]=local.get(k,undefined));
let memT=local.get("t",0);
const cloud={ref:null,status:"local",timer:null,busy:false,again:false,lastSent:null};
const store={
  get(k,d){if(SYNC.includes(k))return mem[k]==null?d:JSON.parse(JSON.stringify(mem[k]));return local.get(k,d)},
  set(k,v){local.set(k,v);if(!SYNC.includes(k))return;mem[k]=v;memT=Date.now();local.set("t",memT);scheduleSave()}
};
function payload(){const o={t:memT};SYNC.forEach(k=>o[k]=JSON.stringify(mem[k]==null?null:mem[k]));return o}
function scheduleSave(){if(!cloud.ref)return;clearTimeout(cloud.timer);cloud.timer=setTimeout(saveNow,700)}
async function saveNow(){
  if(!cloud.ref)return;
  if(cloud.busy){cloud.again=true;return}
  cloud.busy=true;const body=payload();
  try{await cloud.ref.set(body);cloud.lastSent=body.t;setStatus("cloud")}
  catch(e){
    if(e&&e.code==="unavailable"){await new Promise(r=>setTimeout(r,800+Math.random()*1200));try{await cloud.ref.set(body);cloud.lastSent=body.t;setStatus("cloud")}catch(e2){setStatus("error")}}
    else{setStatus(e&&e.code==="invalid_argument"?"readonly":"error");if(e&&(e.code==="invalid_argument"||e.code==="revoked"))cloud.ref=null}
  }
  cloud.busy=false;if(cloud.again){cloud.again=false;saveNow()}
}
function adoptRemote(d){
  if(!d||typeof d.t!=="number")return false;
  if(d.t<=memT)return false;
  SYNC.forEach(k=>{try{const v=d[k]==null?undefined:JSON.parse(d[k]);mem[k]=v===null?undefined:v;local.set(k,mem[k]===undefined?null:mem[k])}catch(e){}});
  memT=d.t;local.set("t",memT);return true;
}
// First load on a device: combine what this browser has with the web copy, so no device's progress is lost.
// Returns true when the combined result differs from the web copy (and should be saved).
function mergeRemote(d){
  const R={};SYNC.forEach(k=>{try{R[k]=d&&d[k]!=null?JSON.parse(d[k]):null}catch(e){R[k]=null}});
  const rt=d&&typeof d.t==="number"?d.t:0,localNewer=memT>rt;
  const L={};SYNC.forEach(k=>L[k]=mem[k]==null?null:mem[k]);
  const stats={...(R.stats||{})};Object.entries(L.stats||{}).forEach(([q,s])=>{const r=stats[q];if(!r||(s.a||0)>(r.a||0)||((s.a||0)===(r.a||0)&&localNewer))stats[q]=s});
  const seen=new Set(),hist=[...(R.hist||[]),...(L.hist||[])].filter(h=>h&&!seen.has(h.t)&&seen.add(h.t)).sort((a,b)=>a.t-b.t).slice(-30);
  const marks=localNewer?{...(R.marks||{}),...(L.marks||{})}:{...(L.marks||{}),...(R.marks||{})};
  const plan={...(R.plan||{})};Object.entries(L.plan||{}).forEach(([i,v])=>{if(v)plan[i]=true});
  const M={stats,hist,marks,plan};
  SYNC.forEach(k=>{mem[k]=M[k];local.set(k,M[k])});
  const same=SYNC.every(k=>JSON.stringify(M[k])===JSON.stringify(R[k]||(k==="hist"?[]:{})));
  memT=same?Math.max(rt,memT):Math.max(Date.now(),rt+1);local.set("t",memT);
  return !same;
}
function setStatus(s){cloud.status=s;const el=document.getElementById("syncnote");if(el)el.innerHTML=syncText()}
function syncText(){return {cloud:"Sparas på webben",local:"Allt sparas på den här enheten",connecting:"Ansluter…",readonly:"Kan inte spara på webben med det här kontot",error:"Kunde inte spara på webben just nu"}[cloud.status]}
async function connectCloud(){
  if(!window.claude||!claude.use)return;
  setStatus("connecting");
  let db=null;try{db=await claude.use("db")}catch(e){}
  if(!db){setStatus("local");return}
  let ref;try{ref=db.doc("progress/lev")}catch(e){setStatus("local");return}
  let first=true;
  const giveUp=setTimeout(()=>{if(first)setStatus("error")},10000);
  ref.onSnapshot(snap=>{
    const d=snap.exists?snap.data():null;
    if(first&&!snap.metadata.fromCache){
      first=false;clearTimeout(giveUp);cloud.ref=ref;
      if(mergeRemote(d)){refreshView();saveNow()}else setStatus("cloud");
      return;
    }
    if(!first&&d&&d.t!==cloud.lastSent&&adoptRemote(d))refreshView();
  },e=>{clearTimeout(giveUp);cloud.ref=null;setStatus(e&&e.code==="revoked"?"local":"error")});
}

const getStats=()=>store.get("stats",{});
function statusOf(q,S){
  const s=S[q[1]];if(!s)return"new";
  const l=s.h[s.h.length-1];
  if(l===0||(s.a>=3&&s.c/s.a<0.5))return"weak";
  if(s.h.length>=2&&s.h[s.h.length-2]===1&&l===1)return"mastered";
  return"learning";
}
function record(q,ok){const S=getStats();const s=S[q[1]]||{a:0,c:0,h:[]};s.a++;if(ok)s.c++;s.h.push(ok?1:0);s.h=s.h.slice(-3);S[q[1]]=s;store.set("stats",S)}
function summarize(area){
  const S=getStats(),o={tot:0,new:0,weak:0,learning:0,mastered:0,a:0,c:0};
  Q.forEach(q=>{if(area&&q[0]!==area)return;o.tot++;o[statusOf(q,S)]++;const s=S[q[1]];if(s){o.a+=s.a;o.c+=s.c}});
  return o;
}
function daysLeft(){const t=new Date(2026,10,11),n=new Date();return Math.round((t-new Date(n.getFullYear(),n.getMonth(),n.getDate()))/864e5)}
function missionIndex(){
  const iso=todayISO();
  const i=PLAN.findIndex(p=>p[0]<=iso&&iso<=p[1]);
  if(i>=0)return i;
  return iso<PLAN[0][0]?0:-1;
}

// ---------- QUIZ
let quiz=null;
function startQuiz(o){
  const S=getStats();
  const base=o.list||Q.filter(q=>!o.area||o.area==="alla"||q[0]===o.area);
  let pool;
  if(o.mode==="svaga"){
    const by={weak:[],learning:[],new:[],mastered:[]};base.forEach(q=>by[statusOf(q,S)].push(q));
    pool=[...shuffle(by.weak),...shuffle(by.learning),...shuffle(by.new),...shuffle(by.mastered)];
  }else pool=shuffle(base);
  pool=shuffle(pool.slice(0,o.n||pool.length));
  quiz={o,pool:pool.map(q=>({q,opts:shuffle([q[2],...q[3]])})),i:0,score:0,streak:0,best:0,wrong:[],picked:null,saved:false};
  state.screen="quiz";state.quitSure=false;render();window.scrollTo(0,0);
}
const PRAISE=["Rätt!","Snyggt!","Toppen!","Helt rätt!","Bra!","Ja, precis!"];
function renderQuiz(){
  if(quiz.i>=quiz.pool.length)return renderResult();
  const {q,opts}=quiz.pool[quiz.i],n=quiz.pool.length,ans=quiz.picked!==null;
  const ok=ans&&opts[quiz.picked]===q[2];
  app.innerHTML=`
  <div class="topbar">
    <button class="back${state.quitSure?" sure":""}" data-act="quit">${state.quitSure?"Säker? Tryck igen":"✕ Sluta"}</button>
    <div class="prog"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${n}" aria-valuenow="${quiz.i+(ans?1:0)}"><i style="width:${(quiz.i+(ans?1:0))/n*100}%"></i></div><span>${quiz.i+1}/${n}</span></div>
  </div>
  <section class="qcard">
    <div class="qmeta">${tag(q[0])}${quiz.streak>=2?`<span class="streak">${quiz.streak} rätt i rad!</span>`:""}</div>
    <p class="q" id="qtext">${esc(q[1])}</p>
    ${state.en?`<p class="en">${esc(q[4])}</p>`:""}
    <div class="row" style="display:flex;gap:8px;flex-wrap:wrap">
      ${enBtn()}
    </div>
    <div class="opts">${opts.map((o,i)=>{
      let cls="",m="";
      if(ans){if(o===q[2]){cls="ok";m="✓"}else if(i===quiz.picked){cls="no";m="✗"}else cls="dim"}
      return `<button class="opt ${cls}" data-act="pick:${i}" ${ans?"disabled":""}><span class="k">${"ABCD"[i]}</span><span class="t">${esc(o)}</span><span class="m" aria-hidden="true">${m}</span></button>`}).join("")}</div>
    ${ans?`<div class="fb ${ok?"good":"bad"}" role="status">
      <span class="h">${ok?PRAISE[(quiz.i+quiz.score)%PRAISE.length]:"Nästan!"}</span>
      ${ok?"":`<span>Rätt svar är: <b>${esc(q[2])}</b></span>`}
      <span class="small">Det står i boken ${q[5]==="PDF"?"på lärarens lapp":q[5]}.</span>
    </div>
    <button class="btn" data-act="next" id="next">${quiz.i+1>=n?"Se hur det gick":"Nästa fråga"} →</button>`:""}
  </section>
  ${ans?"":`<p class="small keys">Tips: du kan trycka 1, 2, 3 eller 4 på tangentbordet.</p>`}`;
  if(ans){const b=document.getElementById("next");b&&b.focus({preventScroll:true})}
}
function pick(i){
  if(quiz.picked!==null)return;
  const {q,opts}=quiz.pool[quiz.i];quiz.picked=i;state.quitSure=false;
  const ok=opts[i]===q[2];record(q,ok);
  if(ok){quiz.score++;quiz.streak++;quiz.best=Math.max(quiz.best,quiz.streak)}else{quiz.wrong.push(q);quiz.streak=0}
  renderQuiz();
  const fb=app.querySelector(".fb");fb&&fb.scrollIntoView({block:"nearest",behavior:"smooth"});
}
function nextQ(){quiz.i++;quiz.picked=null;renderQuiz();window.scrollTo(0,0)}
function renderResult(){
  const n=quiz.pool.length,p=Math.round(quiz.score/n*100);
  const stars=p>=90?3:p>=70?2:1;
  if(!quiz.saved){
    quiz.saved=true;
    const H=store.get("hist",[]);H.push({t:Date.now(),n,s:quiz.score,area:quiz.o.area||"alla"});store.set("hist",H.slice(-30));
    if(quiz.o.mission!=null){const d=store.get("plan",{});d[quiz.o.mission]=true;store.set("plan",d)}
  }
  const msg=p>=90?"Superbra! Du är redo för provet.":p>=70?"Bra jobbat! Kolla in de du missade, så sitter de snart.":"Bra att du tränar! Varje gång blir du lite bättre.";
  const colors=["--water","--town","--forest","--field","--star"];
  const conf=stars>=2?`<div class="confetti" aria-hidden="true">${Array.from({length:28},(_,i)=>`<i style="left:${Math.random()*100}%;background:var(${colors[i%5]});animation-delay:${(Math.random()*.6).toFixed(2)}s"></i>`).join("")}</div>`:"";
  app.innerHTML=`
  <section class="result">
    ${conf}
    <div class="stars" role="img" aria-label="${stars} av 3 stjärnor">${[0,1,2].map(i=>ICON.star.replace("<svg",`<svg class="${i<stars?"on":""}"`)).join("")}</div>
    <p class="big">${quiz.score} av ${n} rätt</p>
    <p class="msg">${msg}</p>
    ${quiz.best>=3?`<p class="small">Längsta raden: ${quiz.best} rätt i rad</p>`:""}
    <div class="stack-btns">
      ${quiz.wrong.length?`<button class="btn orange" data-act="redo">Öva på ${quiz.wrong.length===1?"den du missade":`de ${quiz.wrong.length} du missade`}</button>`:""}
      <button class="btn${quiz.wrong.length?" ghost":""}" data-act="again">Nytt quiz</button>
      <button class="btn ghost" data-act="home">Hem</button>
    </div>
  </section>
  ${quiz.wrong.length?`<section class="remember"><h2 class="sec">Kom ihåg</h2><ul>${quiz.wrong.map(q=>`<li><span>${esc(q[1])}</span><span class="a">${esc(q[2])}</span><span class="small">${q[5]==="PDF"?"Lärarens lapp":"Boken "+q[5]}</span></li>`).join("")}</ul></section>`:""}`;
}

let cards=null;
function startCards(area,list){
  const deck=list||shuffle(T.filter(t=>area==="alla"||t[0]===area));
  cards={area,deck,i:0,flip:false,known:0,more:[]};state.screen="cards";render();window.scrollTo(0,0);
}
function renderCards(){
  if(cards.i>=cards.deck.length)return renderCardsDone();
  const t=cards.deck[cards.i],n=cards.deck.length;
  app.innerHTML=`
  <div class="topbar">
    <button class="back" data-act="home">← Hem</button>
    <div class="prog"><div class="bar"><i style="width:${cards.i/n*100}%"></i></div><span>${cards.i+1}/${n}</span></div>
  </div>

    <button class="flip${cards.flip?" on":""}" id="card" data-act="flip" aria-label="${cards.flip?esc(t[2]):`${esc(t[1])}. Tryck för att vända kortet.`}">
      <span class="face front">${tag(t[0])}<span class="term">${esc(t[1])}</span><span class="hint">Vad betyder ordet? Säg det högt. Tryck sedan på kortet.</span></span>
      <span class="face back-face"><span class="small" style="color:var(--ink)">${esc(t[1])}</span><span class="def">${esc(t[2])}</span>${state.en?`<span class="en">${esc(t[3])}</span>`:""}</span>
    </button>
  </div>
  <div id="cardBtns">${cardBtns()}</div>
  <div class="foot" style="border:0;padding:0">${cards.i>0?`<button class="prev" data-act="prevcard">← Förra kortet</button>`:"<span></span>"}${enBtn()}</div>`;
}
function cardBtns(){
  return cards.flip
    ?`<p class="small" style="text-align:center;margin-bottom:10px">Kunde du det?</p><div class="two"><button class="btn green" data-act="kan">Ja, jag kunde!</button><button class="btn orange" data-act="mer">Öva mer</button></div>`
    :`<button class="btn" data-act="flip">Vänd kortet</button>`;
}
function flipCard(){
  cards.flip=!cards.flip;
  document.getElementById("card").classList.toggle("on",cards.flip);
  document.getElementById("cardBtns").innerHTML=cardBtns();
}
function markCard(m){
  const t=cards.deck[cards.i],s=store.get("marks",{});s[t[1]]=m;store.set("marks",s);
  if(m==="kan")cards.known++;else cards.more.push(t);
  cards.i++;cards.flip=false;renderCards();
}
function renderCardsDone(){
  const n=cards.deck.length,k=cards.known;
  app.innerHTML=`
  <section class="result">
    <div class="stars" role="img" aria-label="Klart">${ICON.star.replace("<svg",'<svg class="on"')}</div>
    <p class="big">${k} av ${n} ord</p>
    <p class="msg">${k===n?"Du kunde alla! Grymt.":"Du har gått igenom alla kort. Öva lite till på de svåra."}</p>
    <div class="stack-btns">
      ${cards.more.length?`<button class="btn orange" data-act="cardsmore">Öva på de ${cards.more.length} svåra orden</button>`:""}
      <button class="btn${cards.more.length?" ghost":""}" data-act="cards:${cards.area}">Alla kort igen</button>
      <button class="btn ghost" data-act="home">Hem</button>
    </div>
  </section>`;
}

function dashHTML(){

  const marks=store.get("marks",{}),cardsKnown=T.filter(t=>marks[t[1]]==="kan").length,cardsMore=T.filter(t=>marks[t[1]]==="mer").length;

// ---------- wiring
function render(){
  ({home:renderHome,topic:renderTopic,quiz:renderQuiz,cards:renderCards,adult:renderAdult})[state.screen]();
}
function goHome(){state.screen="home";quiz=null;cards=null;render();window.scrollTo(0,0)}
function act(a){
  const [cmd,arg]=a.split(":");
  switch(cmd){
    case "home":return goHome();
    case "topic":state.area=arg;state.screen="topic";render();return window.scrollTo(0,0);
    case "quiz":return startQuiz({area:arg,n:10});
    case "weak":return startQuiz({area:arg,n:10,mode:"svaga"});
    case "mix":return startQuiz({area:"alla",n:10});
    case "mission":{const i=missionIndex(),p=PLAN[i];if(!p)return;
      if(AREAS[p[3]])return startQuiz({area:p[3],n:10,mission:i});
      if(p[3]==="alla")return startQuiz({area:"alla",n:20,mission:i});
      if(p[3]==="svaga")return startQuiz({area:"alla",n:10,mode:"svaga",mission:i});
      return startQuiz({area:"alla",n:10,mode:"svaga",mission:i})}
    case "cards":return startCards(arg);
    case "pick":return pick(+arg);
    case "next":return nextQ();
    case "quit":if(state.quitSure)return goHome();state.quitSure=true;return renderQuiz();
    case "redo":return startQuiz({area:quiz.o.area,list:quiz.wrong.slice()});
    case "again":{const o={...quiz.o};delete o.list;delete o.mission;return startQuiz(o.area?o:{area:"alla",n:10})}
    case "flip":return flipCard();
    case "kan":case "mer":return markCard(cmd);
    case "prevcard":cards.i=Math.max(0,cards.i-1);cards.flip=false;return renderCards();
    case "cardsmore":return startCards(cards.area,shuffle(cards.more));
    case "en":state.en=!state.en;store.set("en",state.en);return render();
    case "adult":state.screen="adult";state.confirmReset=false;render();return window.scrollTo(0,0);
    case "atab":state.adultTab=arg;state.confirmReset=false;return render();
    case "reveal":{const r=document.getElementById("r"+arg),b=app.querySelector(`[data-act="reveal:${arg}"]`);r.hidden=!r.hidden;b.textContent=r.hidden?"Visa svar":"Dölj svar";return}
    case "reset":state.confirmReset=true;return render();
    case "reset-no":state.confirmReset=false;return render();
    case "reset-yes":store.set("stats",{});store.set("hist",[]);store.set("marks",{});store.set("plan",{});state.confirmReset=false;return render();
  }
}
app.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(b)act(b.dataset.act)});
document.addEventListener("keydown",e=>{
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  if(state.screen==="quiz"&&quiz&&quiz.i<quiz.pool.length){
    const m={"1":0,"2":1,"3":2,"4":3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];
    if(m!==undefined&&quiz.picked===null){e.preventDefault();pick(m)}
  }
  if(state.screen==="cards"&&cards&&cards.i<cards.deck.length&&e.key===" "&&document.activeElement.tagName!=="BUTTON"){e.preventDefault();flipCard()}
});
render();
// Progress lives in localStorage under the fixed "geo:" keys. Updates must never rename or clear these keys;
// only the in-app "Nollställ framsteg" button resets them. Ask the browser not to evict this storage.
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{})}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
